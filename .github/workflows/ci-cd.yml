name: CI/CD - vivaeventos-payments

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devdb
          POSTGRES_PASSWORD: a1b2c3d4
          POSTGRES_DB: vivaeventos_payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn clean compile

      - name: Run unit tests with coverage
        run: mvn verify
        env:
          JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vivaeventos_payments

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 7

      - name: SonarQube analysis
        continue-on-error: true
        run: |
          mvn sonar:sonar \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.projectKey=vivaeventos-payments \
            -Dsonar.organization=proyecto-desarrollo-iii \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.exclusions=**/model/Dto/*.java,**/repository/*.java,**/domain/service/I*.java
        env:
          JWT_SECRET: dGhpc0lzQVZlcnlTZWNyZXRLZXlGb3JWYWlhRXZlbnRvc1RoYXROZWVkczUw

  docker-build-and-push:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-cloud-run:
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/834797281102/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: cloud-run-admin@vivaeventos-498516.iam.gserviceaccount.com
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Pull from GHCR and push to Artifact Registry
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY,,}
          docker pull ghcr.io/$REPO_LOWER:${{ github.ref_name }}
          docker tag ghcr.io/$REPO_LOWER:${{ github.ref_name }} \
            us-central1-docker.pkg.dev/vivaeventos-498516/cloud-run-images/vivaeventos-payments:${{ github.ref_name }}
          docker push us-central1-docker.pkg.dev/vivaeventos-498516/cloud-run-images/vivaeventos-payments:${{ github.ref_name }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vivaeventos-payments
          image: us-central1-docker.pkg.dev/vivaeventos-498516/cloud-run-images/vivaeventos-payments:${{ github.ref_name }}
          region: us-central1
          env_vars: |
            SERVER_PORT=8080
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DB_URL=jdbc:postgresql://${{ secrets.DB_HOST }}:5432/vivaeventos_payments?sslmode=require
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            ORDERS_SERVICE_URL=${{ secrets.ORDERS_SERVICE_URL }}
            TICKETS_SERVICE_URL=${{ secrets.TICKETS_SERVICE_URL }}
            SERVICES_EVENTS_URL=${{ secrets.SERVICES_EVENTS_URL }}
            SERVICES_NOTIFICATIONS_URL=${{ secrets.SERVICES_NOTIFICATIONS_URL }}
